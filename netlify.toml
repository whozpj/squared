# Netlify reads this from the repo root. Build the frontend and publish its dist.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"   # relative to base -> frontend/dist

# SPA fallback: every route serves index.html so deep links / refresh work.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
