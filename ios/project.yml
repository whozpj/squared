name: Squared
options:
  bundleIdPrefix: com.whozpj
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  Squared:
    type: application
    platform: iOS
    sources:
      - Squared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whozpj.squared
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Squared/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
