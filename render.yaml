# Render blueprint for the backend (free tier). Postgres: use a free Neon database
# and paste its connection string into DATABASE_URL. The frontend deploys separately
# as a static site (see frontend/netlify.toml).
services:
  - type: web
    name: squared-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # paste your Neon connection string
      - key: CORS_ORIGINS
        sync: false # e.g. ["https://your-frontend.netlify.app"]
      - key: JWT_SECRET
        generateValue: true
