# Deploy the frontend as a static site (Netlify free tier).
# Set VITE_API_BASE in the Netlify UI (Site settings → Environment) to the backend URL.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# SPA fallback: every route serves index.html so deep links / refresh work.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
